# ============================================================================
# Cloud Build pipeline — builds both images and deploys to Cloud Run.
# Trigger: push to main branch via GitHub Actions or a Cloud Build trigger.
#
# Substitutions:
#   _REGION   (default: asia-south1)
#   _SA_EMAIL (service account that Cloud Run services run as)
# ============================================================================
substitutions:
  _REGION: asia-south1
  _SA_EMAIL: lexguard-runner@${PROJECT_ID}.iam.gserviceaccount.com
  _REPO: lexguard

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ---- API image ----------------------------------------------------------
  - id: build-api
    name: gcr.io/cloud-builders/docker
    dir: apps/api
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api"]
    waitFor: [build-api]

  # ---- Web image ----------------------------------------------------------
  - id: build-web
    name: gcr.io/cloud-builders/docker
    dir: apps/web
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:latest
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:latest
      - .

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web"]
    waitFor: [build-web]

  # ---- Deploy API ---------------------------------------------------------
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - lexguard-api
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=${_SA_EMAIL}
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --timeout=120
      - --set-env-vars=ENVIRONMENT=production,GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION}
    waitFor: [push-api]

  # ---- Deploy Web ---------------------------------------------------------
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - lexguard-web
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=${_SA_EMAIL}
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
    waitFor: [push-web]

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}
